# configs/ucihar_config.yaml
#
# Loaded by `python -m src.train --config configs/ucihar_config.yaml ...` (and by
# src/profile_efficiency.py so profiled models match trained ones). Values
# here become argparse defaults; any CLI flag overrides them. The dataset
# block is documentation of src/preprocessing.py NATIVE_CONFIGS -- changing
# it here does not re-window the data.

dataset:
  name: ucihar
  # UCI-HAR ships pre-windowed by the source, we don't re-window it
  sampling_rate_hz: 50
  window_samples: 128        # 2.56s @ 50Hz
  step_samples: 64           # 50% overlap
  input_channels: 6          # total_acc_x/y/z, body_gyro_x/y/z (UCIHAR_SIGNALS in preprocessing.py)
  num_classes: 6             # walking, upstairs, downstairs, sitting, standing, laying
  num_subjects: 30
  has_official_split: true   # real official train/test split (21/9 subjects)

evaluation:
  loso_n_folds: 10           # data_loader.py LOSO_N_FOLDS["ucihar"]; 3 subjects held out/fold
  seeds: [0, 1, 2, 3, 4]     # averaged per fold before significance testing
  val_fraction: 0.2          # share of each fold's TRAIN subjects held out for early stopping
  min_val_subjects: 2        # never validate on a single subject

training:
  epochs: 50
  batch_size: 64
  lr: 0.001
  patience: 8                # early stopping on the subject-wise validation set
  select_metric: val_macro_f1  # best epoch / early stopping / LR plateau metric (val loss peaks after 1-3 epochs under subject shift)
  grad_clip: 1.0             # max grad-norm (RNN stability); 0 disables
  lr_scheduler: plateau      # ReduceLROnPlateau(factor=0.5, patience=3) on select_metric

model_defaults:
  # shared architecture knobs; each model only receives the ones it accepts
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  attention_dim: 64          # bilstm_attention_baseline and dual_attention_bigru

dual_attention_bigru:
  # proposed model (src/models/dual_attention_bigru.py) -- see
  # docs/research_gap_notes.md for the spectral-gated novelty writeup.
  # Variant is chosen on the CLI: --dual_attn_variant full|plain|channel_only|temporal_only|all
  channel_reduction: 4
  low_band_hz: [0.3, 3.5]    # human gait/limb-swing band
